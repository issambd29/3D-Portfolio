<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M50 8 L85 24 C85 62 50 90 50 90 C50 90 15 62 15 24 Z" 
        stroke="url(#shieldGrad)" stroke-width="4" fill="#0A1128" fill-opacity="0.85" filter="url(#glow)" />

  <!-- Inner Cyber Grid Lines -->
  <path d="M50 16 L77 28 C77 58 50 80 50 80 C50 80 23 58 23 28 Z" 
        stroke="#00BFFF" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />

  <!-- Terminal / CTF Hacker Prompt Symbols -->
  <path d="M35 44 L45 52 L35 60" stroke="#00BFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="50" y1="60" x2="65" y2="60" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Target Reticle / Key Node -->
  <circle cx="50" cy="30" r="3" fill="#00BFFF" />
  <line x1="50" y1="23" x2="50" y2="37" stroke="#00BFFF" stroke-width="1.5" />
  <line x1="43" y1="30" x2="57" y2="30" stroke="#00BFFF" stroke-width="1.5" />
</svg>
