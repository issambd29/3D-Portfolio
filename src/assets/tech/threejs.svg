<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38EF7D" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00BFFF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(20, 15) scale(0.95)" filter="url(#glow)">
    <!-- Base large triangle -->
    <polygon points="65,225 20,35 210,88" fill="url(#facet1)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inverted center triangle -->
    <polygon points="112,62 135,158 40,131" fill="url(#facet2)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Sub-triangles creating depth -->
    <polygon points="88,144 77,96 124,110" fill="url(#facet3)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="65,48 77,96 30,82" fill="url(#facet2)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="158,76 170,123 123,110" fill="url(#facet1)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
